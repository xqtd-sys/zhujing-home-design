name: home-design-platform

services:
  mysql:
    image: mysql:8.4
    container_name: home-design-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: home_design
      MYSQL_USER: home_design
      MYSQL_PASSWORD: home_design_password
    ports:
      - '${DB_PORT:-3307}:3306'
    volumes:
      - home_design_mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'home_design', '-phome_design_password']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  home_design_mysql_data:
